name = "auditengine"
main = "src/index.ts"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"]
account_id = "b7521ad05fd1dfb93ec2d068138c8e6c"

[[d1_databases]]
binding = "DB"
database_name = "auditengine-d1"
database_id = "b7446147-03da-4dc8-9587-f28b8df6e452"

[[r2_buckets]]
binding = "R2"
bucket_name = "auditengine-r2"

[durable_objects]
bindings = [
  { name = "AGENT_DO", class_name = "AgentDurableObject" },
  { name = "SECURITY_AGENT_DO", class_name = "SecurityAgentDurableObject" },
  { name = "API_AGENT_DO", class_name = "ApiAgentDurableObject" },
  { name = "FRONTEND_AGENT_DO", class_name = "FrontendAgentDurableObject" },
  { name = "DATABASE_AGENT_DO", class_name = "DatabaseAgentDurableObject" },
  { name = "ARCHITECTURE_AGENT_DO", class_name = "ArchitectureAgentDurableObject" },
  { name = "TESTING_AGENT_DO", class_name = "TestingAgentDurableObject" },
  { name = "PERFORMANCE_AGENT_DO", class_name = "PerformanceAgentDurableObject" },
  { name = "DEVOPS_AGENT_DO", class_name = "DevopsAgentDurableObject" },
  { name = "DOCUMENTATION_AGENT_DO", class_name = "DocumentationAgentDurableObject" },
  { name = "VISUAL_QA_AGENT_DO", class_name = "VisualQaAgentDurableObject" },
  { name = "BACKEND_AGENT_DO", class_name = "BackendAgentDurableObject" },
  { name = "DEPENDENCY_AGENT_DO", class_name = "DependencyAgentDurableObject" },
  { name = "A11Y_AGENT_DO", class_name = "A11yAgentDurableObject" },
  { name = "I18N_AGENT_DO", class_name = "I18nAgentDurableObject" },
  { name = "LOGGING_AGENT_DO", class_name = "LoggingAgentDurableObject" },
  { name = "CODE_QUALITY_AGENT_DO", class_name = "CodeQualityAgentDurableObject" },
  { name = "ERROR_HANDLING_AGENT_DO", class_name = "ErrorHandlingAgentDurableObject" },
  { name = "CONFIGURATION_AGENT_DO", class_name = "ConfigurationAgentDurableObject" },
  { name = "REFACTORING_AGENT_DO", class_name = "RefactoringAgentDurableObject" },
  { name = "SHARED_MEMORY_DO", class_name = "SharedMemoryDurableObject" },
  { name = "COORDINATOR_DO", class_name = "CoordinatorDurableObject" },
  { name = "DASHBOARD_DO", class_name = "DashboardDurableObject" },
  { name = "RATE_LIMIT_DO", class_name = "RateLimiterDurableObject" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["AgentDurableObject", "CoordinatorDurableObject", "DashboardDurableObject"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["RateLimiterDurableObject"]

[[migrations]]
tag = "v3"
new_sqlite_classes = [
  "SecurityAgentDurableObject", "ApiAgentDurableObject", "FrontendAgentDurableObject",
  "DatabaseAgentDurableObject", "ArchitectureAgentDurableObject", "TestingAgentDurableObject",
  "PerformanceAgentDurableObject", "DevopsAgentDurableObject", "DocumentationAgentDurableObject",
  "VisualQaAgentDurableObject", "BackendAgentDurableObject", "DependencyAgentDurableObject",
  "A11yAgentDurableObject", "I18nAgentDurableObject", "LoggingAgentDurableObject",
  "CodeQualityAgentDurableObject", "ErrorHandlingAgentDurableObject", "ConfigurationAgentDurableObject",
  "RefactoringAgentDurableObject"
]

[[migrations]]
tag = "v4"
new_sqlite_classes = ["SharedMemoryDurableObject"]

[vars]
STAGING_URL = "https://PASTE_STAGING_URL_HERE"
ADMIN_EMAIL = "admin@example.com"
SEARCH_PROVIDER = "brave"
AI_GATEWAY_URL = ""

# ── Secrets ────────────────────────────────────────────────────────────────
# The following MUST be set with `wrangler secret put <NAME>` — never commit
# real values to [vars]:
#   JWT_SECRET, ENCRYPTION_KEY, ADMIN_PASSWORD,
#   KIMI_API_KEY, MINIMAX_API_KEY, GITHUB_TOKEN, SEARCH_API_KEY,
#   GITHUB_CLIENT_ID, GITHUB_CLIENT_SECRET, GITHUB_WEBHOOK_SECRET,
#   GITLAB_TOKEN, GITLAB_CLIENT_ID, GITLAB_CLIENT_SECRET, GITLAB_WEBHOOK_SECRET,
#   BITBUCKET_TOKEN, BITBUCKET_CLIENT_ID, BITBUCKET_CLIENT_SECRET, BITBUCKET_WEBHOOK_SECRET
#
# For local `wrangler dev`, copy the names above into a gitignored .dev.vars
# file with development values.

[browser]
binding = "BROWSER"

# Hourly continuous re-audit of completed repo audits (handled by the
# scheduled() handler in src/index.ts, which starts ContinuousAuditWorkflow
# instances). Note: [[workflows]] entries do not support a `schedules` key —
# cron triggers must live here.
[triggers]
crons = ["0 * * * *"]

[[queues.producers]]
binding = "WRITE_QUEUE"
queue = "auditengine-write-queue"

# [[queues.consumers]]
# queue = "auditengine-write-queue"
# max_batch_size = 10
# max_batch_timeout = 5
# max_retries = 3

[[workflows]]
binding = "PRIORITY_RESOLVER_WORKFLOW"
name = "priority-resolver"
class_name = "PriorityResolverWorkflow"

[[workflows]]
binding = "SALVATION_WORKFLOW"
name = "salvation"
class_name = "SalvationWorkflow"

[[workflows]]
binding = "CONTINUOUS_AUDIT_WORKFLOW"
name = "continuous-audit"
class_name = "ContinuousAuditWorkflow"

[[workflows]]
binding = "AUDIT_START_WORKFLOW"
name = "audit-start"
class_name = "AuditStartWorkflow"
